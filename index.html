<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1110"><title>FINAL DRIVE — Football Strategy</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#eef2ef;background:#09100e;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}#app{max-width:980px;margin:auto;position:relative;min-height:100dvh;background:#0c1310}.scorebar{position:absolute;top:12px;left:12px;right:12px;height:76px;z-index:5;border-radius:18px;background:#0b100fee;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:6px}.iconbtn{background:#16201c;border:0;color:white;border-radius:13px;font-size:28px;padding:8px 14px}.team{display:flex;align-items:center;gap:6px;font-size:23px}.team small{font-size:11px;color:#b7c1b8}.stripe{height:43px;width:9px;border-radius:6px}.green{background:#75c943}.blue{background:#2e59d3}.score{display:flex;align-items:center;gap:10px}.score>strong{font-size:43px;font-stretch:condensed}.center{display:flex;flex-direction:column;align-items:center}.center small{color:#aeb8af;font-weight:800}.center b{color:#71c667;font-size:25px;white-space:nowrap}.fieldwrap{height:min(78dvh,790px);min-height:510px;position:relative;overflow:hidden;background:#28533b}canvas{display:block;width:100%;height:100%;touch-action:none}.fieldtop{position:absolute;top:100px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.situation{background:#09100ee8;padding:10px;border-radius:13px;display:flex;flex-direction:column;font-size:15px}.situation span{font-size:13px}.fieldactions{display:flex;gap:6px}.chip{background:#101815ed;border:1px solid #75837b;color:#f3f5f1;border-radius:26px;padding:9px 12px;font-size:14px;font-weight:750 </style></head><body><div id="app"><header class="scorebar"><button id="menuBtn" class="iconbtn" aria-label="Menu">☰</button><div class="team left"><span class="stripe green"></span><strong id="homeName">SEA</strong><small>YOU</small></div><div class="score"><strong id="homeScore">35</strong><div class="center"><small id="quarter">Q4</small><b id="clock">1:33</b></div><strong id="awayScore">41</strong></div><div class="team right"><strong id="awayName">DAL</strong><span class="stripe blue"></span></div></header><main><div class="fieldwrap"><canvas id="field" aria-label="Top down football field showing offensive and defensive players and routes"></canvas><div class="fieldtop"><div class="situation"><strong id="situation">2nd & 15 · own 21</strong><span id="clockStatus">Clock running</span></div><div class="fieldactions"><button id="speedBtn" class="chip">1×</button><button id="personnelBtn" class="chip">Personnel · 11 ✎</button></div></div><div class="fieldmiddle"><button id="formationBtn" class="chip">Formation · Spread ✎</button><button id="ratingsBtn" class="chip">◎ Ratings</button></div><div id="playToast" class="toast hidden"></div></div><section class="playbook" id="playbook"><div class="handle" id="handle"></div><div class="topline"><div><b id="callCategory">PASS</b><span id="tempoLabel">No-huddle</span></div><div class="controls"><button id="tempoBtn">Tempo</button><button id="undoBtn">↶ Undo</button><button id="drawBtn">✎ Draw</button></div></div><div class="defense"><span>DEFENSE</span><strong id="defenseLook">Light box <em>Showing blitz</em></strong><small id="defenseDetail">6 or fewer near the line</small></div><p class="hint" id="hint">Pick a target or change a route. Tap SNAP to run the play.</p><div class="toggles"><button id="paBtn">Play action</button><button id="rollBtn">Roll out</button><button id="oobBtn">⏱ Out of bounds</button></div><div id="receivers" class="receivers"></div><div class="categories" id="categories"></div><div class="playchoices" id="playchoices"></div><button id="snapBtn" class="snap">SNAP · N. FANT</button><div class="special"><button id="timeoutBtn">Timeout <span id="timeouts">1 left</span></button><button id="spikeBtn">Spike</button><button id="kickBtn">Field goal</button></div><div class="footnote">Prototype: simulated outcomes and win-probability estimates. Historical NFL data is not connected yet.</div></section></main><div id="overlay" class="overlay hidden"><div class="modal"><button id="closeModal" class="close">✕</button><div id="modalBody"></div></div></div></div><script>'use strict';
const $=id=>document.getElementById(id), canvas=$('field'),ctx=canvas.getContext('2d');
const plays={PASS:['Quick pass','Screen','Deep shot middle','Deep shot left','Deep shot right','Play action','Rollout','Hail Mary'],RUN:['Inside left','Inside right','Off tackle left','Off tackle right','Outside left','Outside right','Up the middle','QB sneak','QB designed run'],RPO:['RPO slant','RPO bubble','RPO inside','RPO glance'],TRICK:['Flea flicker','End around','Receiver pass','Direct snap','Double reverse','Halfback pass']};
const receiverData=[{pos:'WR',name:'T. Lockett',num:16,x:7,y:0,route:'Corner',color:'#9bcf56'},{pos:'TE',name:'N. Fant',num:87,x:66,y:0,route:'Seam',color:'#9bcf56'},{pos:'WR',name:'D. Metcalf',num:14,x:92,y:0,route:'Quick out',color:'#9bcf56'},{pos:'WR',name:'J. Smith-Njigba',num:11,x:79,y:0,route:'Quick out',color:'#9bcf56'},{pos:'RB',name:'D. Dallas',num:31,x:37,y:0,route:'Flat',color:'#9bcf56'}];
const defenders=[['S. Gilmore',21,7,42],['D. Wilson',6,44,23],['M. Hooker',28,63,15],['M. Bell',14,67,32],['D. Bland',26,80,38],['J. Lewis',2,92,31],['J. Kearse',1,50,53],[ 'LB',90,31,57],['LB',97,40,57],['LB',54,50,58],['LB',11,60,57]];
const state={home:35,away:41,clock:93,quarter:4,down:2,toGo:15,ownYard:21,timeouts:1,category:'PASS',play:'Quick pass',target:1,tempo:'No-huddle',defense:'Light box',blitz:true,pa:false,roll:false,oob:false,draw:false,ratings:false,collapsed:false,speed:1,winProb:.13,animating:false,ended:false,history:[],selectedRoute:1};
let viewW=400,viewH=650,anim=null,toastTimer=null,routeOptions=['Quick out','Slant','Seam','Corner','Post','Go','Curl','Dig','Flat','Wheel','Screen','Cross'];
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function formatClock(t){return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
function snapshot(){return JSON.parse(JSON.stringify({home:state.home,away:state.away,clock:state.clock,quarter:state.quarter,down:state.down,toGo:state.toGo,ownYard:state.ownYard,timeouts:state.timeouts,winProb:state.winProb,ended:state.ended}))}
function restore(s){Object.assign(state,s);render()}
function estimateWP(s){const diff=s.home-s.away;const t=Math.max(5,s.clock);const position=(s.ownYard-50)/50;const scoreFactor=diff/(3.2+Math.sqrt(t)/5.5);const possession=0.5+position*.42+(s.down===4?-.25:0)-(s.toGo>10?.12:0);return clamp(1/(1+Math.exp(-(scoreFactor+possession))),.005,.995)}
function render(){ $('homeScore').textContent=state.home;$('awayScore').textContent=state.away;$('clock').textContent=formatClock(state.clock);$('quarter').textContent='Q'+state.quarter;$('situation').textContent=`${['','1st','2nd','3rd','4th'][state.down]} & ${state.toGo} · ${state.ownYard<=50?'own '+state.ownYard:'their '+(100-state.ownYard)}`;$('clockStatus').textContent=state.clock?'Clock running':'Clock expired';$('timeouts').textContent=state.timeouts+' left';$('tempoLabel').textContent=state.tempo;$('callCategory').textContent=state.category;$('defenseLook').innerHTML=`${state.defense} ${state.blitz?'<em>Showing blitz</em>':''}`;$('defenseDetail').textContent=state.defense==='Light box'?'6 or fewer near the line':state.defense==='Loaded box'?'7 or more near the line':'Seven in coverage';$('speedBtn').textContent=state.speed+'×';$('playbook').classList.toggle('hidden',state.collapsed);$('drawBtn').classList.toggle('active',state.draw);$('ratingsBtn').classList.toggle('active',state.ratings);[['paBtn','pa'],['rollBtn','roll'],['oobBtn','oob']].forEach(([id,key])=>$(id).classList.toggle('active',state[key]));$('timeoutBtn').disabled=state.timeouts<1||state.ended;$('spikeBtn').disabled=state.ended;$('kickBtn').disabled=state.ended;$('snapBtn').disabled=state.animating||state.ended;$('snapBtn').textContent=state.animating?'PLAY IN PROGRESS…':state.category==='PASS'?`SNAP · ${receiverData[state.target].name}`:`SNAP · ${state.play.toUpperCase()}`;renderCategories();renderReceivers();drawField()}
function renderCategories(){const el=$('categories');el.innerHTML='';Object.keys(plays).forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===state.category?'active':'';b.onclick=()=>{state.category=c;state.play=plays[c][0];render()};el.appendChild(b)});const box=$('playchoices');box.innerHTML='';plays[state.category].forEach(p=>{const b=document.createElement('button');b.textContent=p;b.className=p===state.play?'active':'';b.onclick=()=>{state.play=p;render()};box.appendChild(b)})}
function renderReceivers(){const el=$('receivers');el.innerHTML='';if(state.category!=='PASS'){el.innerHTML='<p class="hint">Choose your call, then SNAP. Results use the prototype simulation model.</p>';return}receiverData.forEach((r,i)=>{const b=document.createElement('button');b.className='receiver '+(i===state.target?'selected':'');b.innerHTML=`<span class="pos">${r.pos}</span><span class="name">${r.name}</span><span class="route">${r.route} ✎</span><span class="stat">${[76,61,73,76,85][i]}% · ${[6.5,9.8,7,7,6][i]} yds</span>`;b.onclick=()=>{if(state.target===i){const ix=routeOptions.indexOf(r.route);r.route=routeOptions[(ix+1)%routeOptions.length]}else state.target=i;render()};el.appendChild(b)})}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);viewW=rect.width;viewH=rect.height;canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawField()}
function player(x,y,color,num,name,scale=1){const X=x/100*viewW,Y=y/100*viewH,r=10*scale;ctx.beginPath();ctx.arc(X,Y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#0a1b10';ctx.stroke();ctx.fillStyle='#152018';ctx.textAlign='center';ctx.font=`bold ${9*scale}px Arial`;ctx.fillText(num,X,Y+3);if(state.ratings){ctx.font='bold 8px Arial';ctx.fillStyle='#fff';ctx.fillText(String(40+num%60),X,Y-r-4)}if(name&&viewW>330){ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.strokeStyle='#0b160e';ctx.lineWidth=3;ctx.strokeText(name,X,Y+r+12);ctx.fillText(name,X,Y+r+12)}}
function routePath(i){const r=receiverData[i],x=r.x/100*viewW,y=.71*viewH;let endX=x,endY=y-125;switch(r.route){case 'Quick out':endX=x+(x>viewW/2?45:-45);endY=y-44;break;case 'Corner':endX=x+(x>viewW/2?40:-40);endY=y-120;break;case 'Slant':endX=x+(x>viewW/2?-70:70);endY=y-65;break;case 'Post':endX=x+(x>viewW/2?-45:45);endY=y-150;break;case 'Flat':endX=x-70;endY=y-30;break;case 'Screen':endX=x+30;endY=y+20;break;case 'Curl':endY=y-70;break;case 'Cross':endX=x>viewW/2?x-140:x+140;endY=y-70;break;case 'Wheel':endX=x+55;endY=y-120;break;case 'Dig':endX=x-90;endY=y-95;break}return [[x,y],[x+(endX-x)*.35,y+(endY-y)*.65],[endX,endY]]}
function drawField(){if(!viewW||!viewH)return;ctx.clearRect(0,0,viewW,viewH);ctx.fillStyle='#28523a';ctx.fillRect(0,0,viewW,viewH);ctx.fillStyle='#ffffff09';for(let i=0;i<10;i++)if(i%2===0)ctx.fillRect(0,i*viewH/10,viewW,viewH/10);ctx.strokeStyle='#c9ded0';ctx.lineWidth=1.4;for(let i=0;i<=10;i++){const y=i*viewH/10;ctx.beginPath();ctx.moveTo(12,y);ctx.lineTo(viewW-12,y);ctx.stroke();if(i>0&&i<10){ctx.font='bold 14px Arial';ctx.fillStyle='#e3eee6';ctx.fillText(String((i%5)*10||50),15,y-5);ctx.fillText(String((i%5)*10||50),viewW-28,y-5)}}ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(viewW*.08,0);ctx.lineTo(viewW*.08,viewH);ctx.moveTo(viewW*.92,0);ctx.lineTo(viewW*.92,viewH);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#f1ce44';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(15,viewH*.43);ctx.lineTo(viewW-15,viewH*.43);ctx.stroke();ctx.strokeStyle='#78a6f7';ctx.beginPath();ctx.moveTo(15,viewH*.69);ctx.lineTo(viewW-15,viewH*.69);ctx.stroke();ctx.fillStyle='#ffffff18';ctx.textAlign='center';ctx.font='bold 80px Arial';ctx.fillText('FD',viewW/2,viewH*.32);const progress=anim?Math.min(1,(performance.now()-anim.start)/anim.duration):0;const offenseX=[7,30,37,45,53,61,68,79,92,44,38];const offNums=[16,67,68,63,75,72,87,11,14,7,31];const offNames=['T. Lockett','','','','','','N. Fant','J. Smith-Njigba','D. Metcalf','G. Smith','D. Dallas'];if(state.category==='PASS'||state.play==='Play action'){receiverData.forEach((r,i)=>{const path=routePath(i);ctx.beginPath();ctx.moveTo(path[0][0],path[0][1]);ctx.lineTo(path[1][0],path[1][1]);ctx.lineTo(path[2][0],path[2][1]);ctx.strokeStyle=i===state.target?'#ffffff':'#d9e4dfb8';ctx.lineWidth=i===state.target?3:2;ctx.setLineDash(i===state.target?[]:[5,5]);ctx.stroke();ctx.setLineDash([])})}defenders.forEach((d,i)=>{let x=d[2],y=d[3];if(anim){y+=progress*8;x+=Math.sin(progress*3+i)*progress*3}player(x,y,i<7?'#dba64e':'#cc9250',d[1],i<7?d[0]:'')});offenseX.forEach((x,i)=>{let y=i===9?82:i===10?88:.72*100;if(anim){const travel=progress*100;if([0,6,7,8,10].includes(i)){const idx={0:0,6:1,8:2,7:3,10:4}[i];const path=routePath(idx);const q=progress<.55?progress/.55:1;const seg=q<.5?0:1,frac=q<.5?q*2:(q-.5)*2;x=(path[seg][0]+(path[seg+1][0]-path[seg][0])*frac)/viewW*100;y=(path[seg][1]+(path[seg+1][1]-path[seg][1])*frac)/viewH*100}else if(i===9){y-=Math.min(progress,.4)*10}}player(x,y,'#a7d76c',offNums[i],offNames[i])});if(anim&&progress>.44&&progress<.84&&state.category==='PASS'){const target=routePath(state.target)[2],q=(progress-.44)/.4;ctx.beginPath();ctx.ellipse(viewW*.44+(target[0]-viewW*.44)*q,viewH*.79+(target[1]-viewH*.79)*q,5,3,.5,0,Math.PI*2);ctx.fillStyle='#7b4b2c';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}if(anim&&progress<1)requestAnimationFrame(drawField)}
function modal(html){$('modalBody').innerHTML=html;$('overlay').classList.remove('hidden')}
function closeModal(){$('overlay').classList.add('hidden')}
function nextDefense(){state.defense=['Light box','Loaded box','Soft coverage'][Math.floor(Math.random()*3)];state.blitz=state.defense==='Light box'&&Math.random()<.55}
function simulation(){const prev=snapshot();state.history.push(prev);const base=state.category==='PASS'?{chance:.66,yards:9}:state.category==='RUN'?{chance:.94,yards:4}:state.category==='RPO'?{chance:.8,yards:6}:{chance:.55,yards:12};let chance=base.chance,mean=base.yards;if(state.play.includes('Deep')){chance-=.32;mean=23}if(state.play==='Hail Mary'){chance=.11;mean=42}if(state.play.includes('Screen')){chance+=state.blitz?.16:-.08;mean=7}if(state.play.includes('Quick'))chance+=state.blitz?.12:-.04;if(state.defense==='Loaded box'&&state.category==='RUN')mean-=2;if(state.defense==='Loaded box'&&state.pa)mean+=4;if(state.defense==='Soft coverage'&&state.category==='RUN')mean+=3;if(state.oob)chance-=.05;chance=clamp(chance,.06,.98);const turnover=Math.random()<(state.category==='PASS'?.025:.012),success=Math.random()<chance;let yards=success?Math.round(Math.max(-3,rnd(mean*.35,mean*1.9))):0;if(turnover)yards=0;const elapsed=state.category==='RUN'?Math.round(rnd(5,9)):Math.round(rnd(4,8));let clockDrain=elapsed+(state.tempo==='Milk clock'?Math.min(32,state.clock-elapsed):state.tempo==='Huddle'?Math.min(17,Math.max(0,state.clock-elapsed)):Math.min(7,Math.max(0,state.clock-elapsed)));if(!success||state.oob&&success)clockDrain=elapsed;state.clock=Math.max(0,state.clock-clockDrain);state.ownYard=clamp(state.ownYard+yards,1,100);let result=turnover?'TURNOVER':success?`${yards}-yard gain`:'Incomplete / stopped';if(turnover){state.ended=true;result='Turnover — possession lost'}else if(state.ownYard>=100){state.home+=7;state.ended=true;result='TOUCHDOWN!'}else if(yards>=state.toGo){state.down=1;state.toGo=10;result+=' · FIRST DOWN'}else{state.toGo=Math.max(1,state.toGo-yards);state.down++;if(state.down>4){state.ended=true;result='Turnover on downs'}}if(state.clock===0)state.ended=true;state.winProb=estimateWP(state);const wpa=(state.winProb-prev.winProb)*100;const candidates=[...plays.PASS,...plays.RUN,...plays.RPO,...plays.TRICK];const baseline=(state.category==='PASS'?.025:state.category==='RUN'?.015:.012)+(state.blitz&&state.play.includes('Screen')?.018:0)+(state.defense==='Loaded box'&&state.play.includes('Play action')?.02:0);const best=baseline+.018;const regret=Math.max(0,(best-baseline)*100+rnd(-1,2.5));const grade=regret<=.5?'green':regret<=2?'yellow':regret<=5?'orange':'red';const label={green:'✓ Best call',yellow:'≈ Good call',orange:'! Costly call',red:'✕ Big miss'}[grade];nextDefense();return {result,wpa,grade,label,regret,prev,chosen:state.play,best:candidates[Math.floor(Math.random()*candidates.length)]}}
function snap(){if(state.animating||state.ended)return;state.animating=true;const outcome=simulation();anim={start:performance.now(),duration:1800/state.speed};$('snapBtn').disabled=true;drawField();setTimeout(()=>{anim=null;state.animating=false;render();modal(`<h2>${outcome.result}</h2><div class="grade ${outcome.grade}">${outcome.label}</div><p>Win probability change: <strong>${outcome.wpa>=0?'+':''}${outcome.wpa.toFixed(1)} percentage points</strong></p><p>Estimated current win probability: <strong>${(state.winProb*100).toFixed(1)}%</strong></p><p>Your call: <strong>${outcome.chosen}</strong></p><p>Prototype call-grade gap: ${outcome.regret.toFixed(1)} points</p><p><strong>Important:</strong> This demonstration uses illustrative grading, not calibrated historical NFL simulations. Do not treat the recommended call or grade as real analytics.</p><button class="action" id="continueBtn">${state.ended?'See drive summary':'Next play →'}</button>`);$('continueBtn').onclick=()=>{closeModal();if(state.ended)showSummary()};},anim.duration)}
function showSummary(){modal(`<h2>Drive complete</h2><p>Final score: SEA ${state.home} — DAL ${state.away}</p><p>${state.home>state.away?'You won!':state.home===state.away?'Tied game':'The drive is over.'}</p><p>Plays called: ${state.history.length}</p><p>This is a playable prototype. Daily rankings, authentic coach percentiles and historical NFL sampling are planned integrations.</p><button class="action" id="restart">Play again</button>`);$('restart').onclick=()=>{closeModal();reset()}}
function reset(){Object.assign(state,{home:35,away:41,clock:93,quarter:4,down:2,toGo:15,ownYard:21,timeouts:1,winProb:.13,ended:false,history:[],animating:false});nextDefense();render()}
function special(kind){if(state.ended)return;if(kind==='timeout'){if(state.timeouts<1)return;state.history.push(snapshot());state.timeouts--;modal('<h2>Timeout called</h2><p>The game clock is stopped. You have '+state.timeouts+' timeout(s) remaining.</p><button class="action" id="ok">Continue</button>');$('ok').onclick=closeModal}else if(kind==='spike'){state.history.push(snapshot());state.clock=Math.max(0,state.clock-2);state.down++;if(state.down>4||!state.clock)state.ended=true;modal('<h2>Spike</h2><p>Clock stopped. Two seconds elapsed and a down was used.</p><button class="action" id="ok">Continue</button>');$('ok').onclick=()=>{closeModal();if(state.ended)showSummary()}}else if(kind==='kick'){state.history.push(snapshot());const dist=117-state.ownYard;const probability=clamp(.98-(dist-25)*.015,.05,.99),good=Math.random()<probability;state.clock=Math.max(0,state.clock-5);if(good)state.home+=3;state.ended=true;modal(`<h2>${good?'FIELD GOAL GOOD':'FIELD GOAL MISSED'}</h2><p>${dist}-yard attempt · prototype success probability ${(probability*100).toFixed(0)}%</p><button class="action" id="ok">Drive summary</button>`);$('ok').onclick=()=>{closeModal();showSummary()}}render()}
$('snapBtn').onclick=snap;$('timeoutBtn').onclick=()=>special('timeout');$('spikeBtn').onclick=()=>special('spike');$('kickBtn').onclick=()=>special('kick');$('closeModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('menuBtn').onclick=()=>modal('<h2>FINAL DRIVE</h2><p>Ad-free 2D football strategy prototype.</p><p>Call plays, choose routes, manage the clock, and watch the action unfold. The historical NFL dataset and calibrated win-probability simulation are not yet integrated.</p><button class="action" id="newGame">New drive</button>');document.addEventListener('click',e=>{if(e.target.id==='newGame'){closeModal();reset()}});$('speedBtn').onclick=()=>{state.speed=state.speed===1?2:state.speed===2?4:1;render()};$('ratingsBtn').onclick=()=>{state.ratings=!state.ratings;render()};$('personnelBtn').onclick=()=>modal('<h2>Personnel</h2><p>11 personnel is available in the prototype. Historical roster substitutions require the player-participation data integration.</p><button class="action" id="ok">OK</button>');$('formationBtn').onclick=()=>modal('<h2>Formation</h2><p>Spread formation is shown. Formation editing will be added with the full playbook.</p>');$('tempoBtn').onclick=()=>{state.tempo=state.tempo==='No-huddle'?'Huddle':state.tempo==='Huddle'?'Milk clock':'No-huddle';render()};$('undoBtn').onclick=()=>{if(state.animating)return;const prev=state.history.pop();if(prev)restore(prev)};$('drawBtn').onclick=()=>{state.draw=!state.draw;state.collapsed=state.draw;render();if(state.draw){$('playbook').classList.remove('hidden');state.collapsed=false;render();$('hint').textContent='Draw mode: drag a receiver marker on the field to set a route endpoint.'}else $('hint').textContent='Pick a target or change a route. Tap SNAP to run the play.'};[['paBtn','pa'],['rollBtn','roll'],['oobBtn','oob']].forEach(([id,key])=>$(id).onclick=()=>{state[key]=!state[key];render()});$('handle').onclick=()=>{state.collapsed=!state.collapsed;render()};
let dragStart=null;canvas.addEventListener('pointerdown',e=>{if(!state.draw)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;const idx=receiverData.findIndex(r=>Math.abs(r.x-x)<10&&Math.abs(72-y)<9);if(idx>=0){dragStart=idx;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointerup',e=>{if(dragStart===null)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;const r=receiverData[dragStart];r.route=y<50?'Go':x>r.x+10?'Quick out':x<r.x-10?'Slant':'Curl';state.target=dragStart;dragStart=null;render()});window.addEventListener('resize',resize);render();resize();
</script></body></html>
